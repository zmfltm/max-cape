name: Refresh stats and rebuild

# GitHub Pages serves static files, so the live endpoints in serve.py do not
# exist there. This re-pulls the hiscores and WikiSync, rebuilds the pages and
# commits, which keeps the published site current without a backend.
on:
  schedule:
    - cron: "17 */6 * * *"   # every six hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-static-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull hiscores
        run: python3 fetch_stats.py || echo "hiscores unavailable, keeping last snapshot"

      - name: Pull quests and diaries
        run: python3 fetch_quests.py || echo "WikiSync unavailable, keeping last snapshot"

      - name: Pull shooting stars
        run: python3 fetch_stars.py || echo "star tracker unavailable, keeping last snapshot"

      - name: Rebuild
        run: python3 build.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: refresh stats and rebuild"
          git push

# Parked here because the CLI token used to push lacked the `workflow` scope.
# To enable: move this file to .github/workflows/refresh.yml and push with a
# token that has `workflow` (gh auth refresh -s workflow).
